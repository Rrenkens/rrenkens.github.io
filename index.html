<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Web API demonstrations and browser experiments.">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF8FD">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141218">
    <title>rrenkens.github.io</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="home-page">
    <div class="home-wrapper">
        <header class="home-header">
            <div class="home-logo" aria-hidden="true">
                <span class="material-symbols-outlined icon-terminal">terminal</span>
            </div>
            <h1 class="home-title">Web APIs</h1>
        </header>

        <!-- API Cards Grid -->
        <main class="api-grid">
            <a id="card-window-management"
               href="web-api/window-management-api/"
               class="api-card api-card--window-management"
               data-icon="desktop_windows"
               data-title="Window Management API"
               data-desc="Multi-screen layout coordinates, topology visualizer, and display details query.">
            </a>

            <a id="card-screen-api"
               href="web-api/screen-api/"
               class="api-card api-card--screen"
               data-icon="aspect_ratio"
               data-title="Screen API"
               data-desc="Viewport pixel bounds, available screen areas, color depth, and rotation angle.">
            </a>

            <a id="card-idle-detection"
               href="web-api/idle-detection-api/"
               class="api-card api-card--idle-detection"
               data-icon="bedtime"
               data-title="Idle Detection API"
               data-desc="User presence detector, inactivity thresholds, and screen lock change listener.">
            </a>

            <a id="card-web-usb"
               href="web-api/usb/"
               class="api-card api-card--usb"
               data-icon="usb"
               data-title="WebUSB API"
               data-desc="Peripheral pairing picker, USB device descriptors tree, and endpoint inspector.">
            </a>
        </main>
    </div>

    <template id="api-card-template">
        <div class="api-card-top">
            <div class="api-card-icon" aria-hidden="true">
                <span class="material-symbols-outlined icon-card"></span>
            </div>
            <span class="api-card-arrow" aria-hidden="true">
                <span class="material-symbols-outlined icon-arrow">arrow_forward</span>
            </span>
        </div>
        <div>
            <h2 class="api-card-title"></h2>
            <p class="api-card-desc"></p>
        </div>
    </template>

    <script>
        const template = document.getElementById('api-card-template');
        for (const card of document.querySelectorAll('.api-card')) {
            const fragment = template.content.cloneNode(true);
            fragment.querySelector('.icon-card').textContent = card.dataset.icon || '';
            fragment.querySelector('.api-card-title').textContent = card.dataset.title || '';
            fragment.querySelector('.api-card-desc').textContent = card.dataset.desc || '';
            card.appendChild(fragment);
        }
    </script>
</body>

</html>
